[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "soulillusions-agent"
version = "1.0.0"
description = "SoulIllusions — Autonomous AI Agent with Web UI, Book Writer, and Audiobook System"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "SoulIllusions"}
]
keywords = ["ai", "agent", "ollama", "llm", "book-writer", "audiobook", "autonomous", "web-ui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
tts = ["pyttsx3>=2.90"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
soulillusions = "soulillusions.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
soulillusions = ["webui/*.html", "default_config.json"]
